# Is the hub up? Asked from outside Hostinger, every 15 minutes.
#
# A failed run is the alarm: GitHub notifies whoever last changed this
# schedule, by email and as a push from the GitHub iPhone app. Why this
# lives here, what /health answers and what it leaves out are in
# deploy/README.md of my-electron-react-app, "Being told when it is down".
#
# Three tries ten seconds apart before failing, so a blip is not an outage.
#
# And when none of the three could even connect, three more five minutes
# later. Between 20 October and 3 November 2026, 14 of 15 failures were
# this runner unable to open a connection while the hub went on serving
# phones and Macs, and the next run passed every time: an alarm about the
# road from GitHub, not about the hub. An answer the hub gives (a 503
# when it is unhealthy) still fails at once.
#
# Run it by hand with another address to see the alarm go off: a check
# that has never failed has not shown it can.
name: Hub health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Address to check
        default: https://sync.ideaquantum.com/health

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Ask the hub
        env:
          URL: ${{ inputs.url || 'https://sync.ideaquantum.com/health' }}
        run: |
          ask() { curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 10 --retry-all-errors "$URL"; }
          status=0
          ask || status=$?
          # 6 no address, 7 refused, 28 timed out: never reached the hub.
          case "$status" in
            0) exit 0 ;;
            6|7|28)
              echo "::warning::Could not reach the hub (curl $status). Asking again in five minutes."
              sleep 300
              ask ;;
            *) exit "$status" ;;
          esac
